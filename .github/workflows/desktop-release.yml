name: Publish Teler Desktop release

# Builds Teler Desktop installers for macOS, Windows and Linux and publishes
# them as a GitHub release. macOS and Windows builds need their native
# toolchains, so they run on GitHub-hosted runners. Builds are unsigned unless
# the optional DESKTOP_* signing secrets exist (see desktop/README.md).
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel. Nightly is a manually published prerelease.'
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      version:
        description: 'Required for stable; must exactly match desktop/package.json'
        required: false
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      title: ${{ steps.plan.outputs.title }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Choose version and tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(jq -r .version desktop/package.json)"
          case "$CHANNEL" in
            stable)
              if [[ "$REQUESTED_VERSION" != "$package_version" ]]; then
                echo "::error::stable version must equal desktop/package.json (${package_version})"
                exit 1
              fi
              version="$package_version"
              title="Teler Desktop ${version}"
              prerelease=false
              ;;
            nightly)
              version="${package_version}-nightly.${GITHUB_RUN_NUMBER}"
              title="Teler Desktop ${version}"
              prerelease=true
              ;;
            *)
              echo '::error::unsupported release channel'
              exit 1
              ;;
          esac
          tag="desktop-v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release ${tag} already exists and will not be mutated"
            exit 1
          fi
          # A tag can outlive its deleted release, and a release for an existing
          # tag keeps the tag's commit regardless of --target.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} already exists and will not be reused"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "title=${title}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: mac
            runner: macos-15
            sidecars: mac-arm64 mac-x64
            targets: --mac --arm64 --x64
          - platform: win
            runner: windows-2025
            sidecars: win-x64
            targets: --win --x64
          - platform: linux
            runner: ubuntu-24.04
            sidecars: linux-x64
            targets: --linux --x64
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Set up Node.js for electron-builder
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the app bundles
        run: bun run --filter desktop build

      - name: Compile the teler sync sidecar
        working-directory: desktop
        run: bun scripts/sidecar.ts ${{ matrix.sidecars }}

      # The compiled sync engine runs on this OS only here before release: it
      # previews a folder and runs the daemon without a server.
      - name: Smoke-test the sync sidecar on this OS
        working-directory: desktop
        run: bun scripts/smoke-sidecar.ts

      - name: Package installers
        working-directory: desktop
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGETS: ${{ matrix.targets }}
          # Optional signing. Without these secrets the builds stay unsigned
          # (ad-hoc signed on macOS so Apple silicon can launch them).
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.DESKTOP_MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.DESKTOP_MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.DESKTOP_WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.DESKTOP_WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.DESKTOP_APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.DESKTOP_APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          read -r -a target_args <<< "$TARGETS"
          args=("${target_args[@]}" --publish never "-c.extraMetadata.version=${VERSION}")
          if [[ "$PLATFORM" == mac ]]; then
            if [[ -z "$CSC_LINK" ]]; then
              # Ad-hoc signing: hardened runtime is only for notarized builds,
              # and with an ad-hoc identity it blocks Electron's frameworks.
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              args+=("-c.mac.identity=-" "-c.mac.hardenedRuntime=false")
            elif [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" ]]; then
              args+=("-c.mac.notarize=true")
            fi
          fi
          node node_modules/electron-builder/cli.js "${args[@]}"

      - name: Verify package contents
        working-directory: desktop
        run: bun scripts/verify-package.ts

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teler-desktop-${{ matrix.platform }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: teler-desktop-*
          path: installers
          merge-multiple: true

      - name: Write checksums
        working-directory: installers
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TITLE: ${{ needs.plan.outputs.title }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/desktop-release-notes.md"
          cat > "$notes" <<EOF
          Teler Desktop ${VERSION}, built from \`${GITHUB_SHA}\`.

          - macOS: \`.dmg\` or \`.zip\` for Apple silicon (arm64) or Intel (x64).
          - Windows: the \`.exe\` installer (x64).
          - Linux: \`.AppImage\` or \`.deb\` (x64).

          Verify downloads with \`SHA256SUMS.txt\`. Unsigned builds need a one-time approval:
          on macOS, open Teler once, then choose Open Anyway in System Settings → Privacy &
          Security; on Windows, choose More info → Run anyway. See \`desktop/README.md\`.
          EOF
          args=(
            "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$TITLE"
            --notes-file "$notes"
          )
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          # Published only once every installer is attached: update checks skip drafts.
          gh release create "${args[@]}" --draft installers/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
