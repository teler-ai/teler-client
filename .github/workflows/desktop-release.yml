name: Publish Teler Desktop release

# Builds Teler Desktop installers for macOS, Windows and Linux and publishes
# them as a GitHub release. macOS and Windows builds need their native
# toolchains, so they run on GitHub-hosted runners. Builds are unsigned unless
# the optional DESKTOP_* signing secrets exist (see desktop/README.md), and the
# release notes say which installers are signed.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel. Nightly is a manually published prerelease.'
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      version:
        description: 'Required for stable; must exactly match desktop/package.json'
        required: false
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      title: ${{ steps.plan.outputs.title }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Choose version and tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(jq -r .version desktop/package.json)"
          case "$CHANNEL" in
            stable)
              if [[ "$REQUESTED_VERSION" != "$package_version" ]]; then
                echo "::error::stable version must equal desktop/package.json (${package_version})"
                exit 1
              fi
              version="$package_version"
              title="Teler Desktop ${version}"
              prerelease=false
              ;;
            nightly)
              version="${package_version}-nightly.${GITHUB_RUN_NUMBER}"
              title="Teler Desktop ${version}"
              prerelease=true
              ;;
            *)
              echo '::error::unsupported release channel'
              exit 1
              ;;
          esac
          tag="desktop-v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release ${tag} already exists and will not be mutated"
            exit 1
          fi
          # A tag can outlive its deleted release, and a release for an existing
          # tag keeps the tag's commit regardless of --target.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} already exists and will not be reused"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "title=${title}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # Every platform finishes, so one run shows every problem; publishing still needs all.
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: macos-15
            sidecars: mac-arm64 mac-x64
            targets: --mac --arm64 --x64
          - platform: win
            runner: windows-2025
            sidecars: win-x64
            targets: --win --x64
          - platform: linux
            runner: ubuntu-24.04
            sidecars: linux-x64
            targets: --linux --x64
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Set up Node.js for electron-builder
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the app bundles
        run: bun run --filter desktop build

      - name: Compile the teler sync sidecar
        working-directory: desktop
        run: bun scripts/sidecar.ts ${{ matrix.sidecars }}

      # The compiled sync engine runs on this OS only here before release: it
      # previews a folder and runs the daemon without a server.
      - name: Smoke-test the sync sidecar on this OS
        working-directory: desktop
        run: bun scripts/smoke-sidecar.ts

      # The notarization key as a file outside the checkout and build output, for
      # the packaging and disk image steps alone; the step after them always
      # removes it.
      - name: Write the notarization key
        if: matrix.platform == 'mac'
        shell: bash
        env:
          KEY_P8: ${{ secrets.DESKTOP_APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [[ -n "$KEY_P8" ]]; then
            umask 077
            mkdir -p "$RUNNER_TEMP/notarization"
            printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/notarization/AuthKey.p8"
          fi

      - name: Package installers
        working-directory: desktop
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGETS: ${{ matrix.targets }}
          # Optional signing. Without these secrets the builds stay unsigned
          # (ad-hoc signed on macOS so Apple silicon can launch them).
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.DESKTOP_MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.DESKTOP_MAC_CSC_KEY_PASSWORD || '' }}
          WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.DESKTOP_WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.DESKTOP_WIN_CSC_KEY_PASSWORD || '' }}
          # Notarization with the team's App Store Connect API key, whose file the
          # step above wrote; electron-builder reads its path from APPLE_API_KEY.
          NOTARIZATION_KEY: ${{ runner.temp }}/notarization/AuthKey.p8
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && secrets.DESKTOP_APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && secrets.DESKTOP_APPLE_API_ISSUER_ID || '' }}
        run: |
          set -euo pipefail
          # An empty CSC_LINK would be read as a certificate path: drop unset secrets.
          for name in CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD \
            APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then unset "$name"; fi
          done
          read -r -a target_args <<< "$TARGETS"
          args=("${target_args[@]}" --publish never "-c.extraMetadata.version=${VERSION}")
          if [[ "$PLATFORM" == mac ]]; then
            if [[ -z "${CSC_LINK:-}" ]]; then
              # Ad-hoc signing: hardened runtime is only for notarized builds,
              # and with an ad-hoc identity it blocks Electron's frameworks.
              export CSC_IDENTITY_AUTO_DISCOVERY=false
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
              args+=("-c.mac.identity=-" "-c.mac.hardenedRuntime=false")
            elif [[ -s "$NOTARIZATION_KEY" && -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER:-}" ]]; then
              # electron-builder would take an Apple ID first, so none may be set.
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
              export APPLE_API_KEY="$NOTARIZATION_KEY"
              echo "Notarizing with the App Store Connect API key"
              args+=("-c.mac.notarize=true")
            else
              # Gatekeeper refuses a downloaded app that's signed but not notarized.
              echo '::error::a signed macOS build needs notarization: set DESKTOP_APPLE_API_KEY_P8, DESKTOP_APPLE_API_KEY_ID and DESKTOP_APPLE_API_ISSUER_ID'
              exit 1
            fi
          fi
          node node_modules/electron-builder/cli.js "${args[@]}"

      # electron-builder notarizes the app but leaves the disk image unsigned, and
      # Gatekeeper rejects a downloaded .dmg without a usable signature. A signed
      # build signs each .dmg with the same Developer ID, then notarizes and staples
      # it, as Apple documents for disk images. The .zip carries the stapled app.
      - name: Sign, notarize and staple the disk images
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: desktop/release
        env:
          CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          NOTARIZATION_KEY: ${{ runner.temp }}/notarization/AuthKey.p8
          KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" ]]; then
            echo 'Unsigned build: the disk images stay unsigned'
            exit 0
          fi
          if [[ ! -s "$NOTARIZATION_KEY" || -z "${KEY_ID:-}" || -z "${ISSUER:-}" ]]; then
            echo '::error::signed disk images need notarization: set DESKTOP_APPLE_API_KEY_P8, DESKTOP_APPLE_API_KEY_ID and DESKTOP_APPLE_API_ISSUER_ID'
            exit 1
          fi
          shopt -s nullglob
          images=(*.dmg)
          if (( ${#images[@]} == 0 )); then
            echo '::error::no disk images to sign'
            exit 1
          fi
          # electron-builder deletes its own keychain when it finishes, so the
          # certificate goes into a keychain for this step.
          keychain="${RUNNER_TEMP}/teler-dmg-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="${RUNNER_TEMP}/teler-dmg-signing.p12"
          trap 'rm -f "$certificate"' EXIT
          security create-keychain -p "$keychain_password" "$keychain"
          # Exported at once, so the cleanup step deletes it even if a later command fails.
          echo "SIGNING_KEYCHAIN=${keychain}" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CSC_LINK" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" -P "${CSC_KEY_PASSWORD:-}" -T /usr/bin/codesign >/dev/null
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          read -r -a existing <<< "$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application/ { print $2; exit }')"
          if [[ -z "$identity" ]]; then
            echo '::error::DESKTOP_MAC_CSC_LINK holds no Developer ID Application identity'
            exit 1
          fi
          for image in "${images[@]}"; do
            codesign --sign "$identity" --keychain "$keychain" --timestamp \
              --identifier ai.teler.desktop.dmg "$image"
            result="${RUNNER_TEMP}/notarization/${image}.json"
            xcrun notarytool submit "$image" --key "$NOTARIZATION_KEY" \
              --key-id "$KEY_ID" --issuer "$ISSUER" --wait --timeout 30m \
              --output-format json > "$result" || true
            # A rejection exits non-zero: read the status here so Apple's log is printed.
            status="$(jq -r '.status // "unknown"' "$result" 2>/dev/null || echo unknown)"
            echo "Notarization of ${image}: ${status}"
            if [[ "$status" != Accepted ]]; then
              id="$(jq -r '.id // empty' "$result" 2>/dev/null || true)"
              if [[ -n "$id" ]]; then
                xcrun notarytool log "$id" --key "$NOTARIZATION_KEY" \
                  --key-id "$KEY_ID" --issuer "$ISSUER" || true
              fi
              exit 1
            fi
            xcrun stapler staple "$image"
          done

      - name: Remove the notarization key and signing keychain
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/notarization"
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi

      # What a downloaded signed .dmg must pass: a valid timestamped Developer ID
      # signature, a stapled ticket and Gatekeeper's assessment as notarized.
      - name: Verify the disk images
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: desktop/release
        env:
          MAC_SIGNED: ${{ secrets.DESKTOP_MAC_CSC_LINK != '' }}
        run: |
          set -euo pipefail
          if [[ "$MAC_SIGNED" != true ]]; then
            echo 'Unsigned build: no disk image signatures to verify'
            exit 0
          fi
          shopt -s nullglob
          images=(*.dmg)
          if (( ${#images[@]} == 0 )); then
            echo '::error::no disk images to verify'
            exit 1
          fi
          for image in "${images[@]}"; do
            codesign --verify --strict --verbose=2 "$image"
            details="$(codesign -dvv "$image" 2>&1)"
            for expected in 'Authority=Developer ID Application' 'Timestamp='; do
              if [[ "$details" != *"$expected"* ]]; then
                echo "::error::${image} lacks ${expected}"
                exit 1
              fi
            done
            xcrun stapler validate "$image"
            if ! assessment="$(spctl -a -vvv -t open --context context:primary-signature "$image" 2>&1)"; then
              echo "$assessment"
              echo "::error::Gatekeeper rejects ${image}"
              exit 1
            fi
            echo "$assessment"
            if [[ "$assessment" != *'source=Notarized Developer ID'* ]]; then
              echo "::error::Gatekeeper does not see ${image} as notarized"
              exit 1
            fi
          done

      - name: Verify package contents
        working-directory: desktop
        run: bun scripts/verify-package.ts

      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teler-desktop-${{ matrix.platform }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: teler-desktop-*
          path: installers
          merge-multiple: true

      - name: Write checksums
        working-directory: installers
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          TITLE: ${{ needs.plan.outputs.title }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          # The build signs each platform only when its certificate exists, and a
          # signed macOS build always fails unless it is notarized, so these say
          # what the attached installers are.
          MAC_SIGNED: ${{ secrets.DESKTOP_MAC_CSC_LINK != '' }}
          WIN_SIGNED: ${{ secrets.DESKTOP_WIN_CSC_LINK != '' }}
        run: |
          set -euo pipefail
          if [[ "$MAC_SIGNED" == true ]]; then
            mac_note="- macOS: \`.dmg\` or \`.zip\` for Apple silicon (arm64) or Intel (x64), signed with
            Teler's Developer ID and notarized by Apple."
          else
            mac_note="- macOS: \`.dmg\` or \`.zip\` for Apple silicon (arm64) or Intel (x64). Not signed:
            open Teler once, then choose Open Anyway in System Settings → Privacy & Security."
          fi
          if [[ "$WIN_SIGNED" == true ]]; then
            win_note="- Windows: the \`.exe\` installer (x64), signed."
          else
            win_note="- Windows: the \`.exe\` installer (x64). Not signed yet: if SmartScreen appears,
            choose More info → Run anyway."
          fi
          notes="${RUNNER_TEMP}/desktop-release-notes.md"
          cat > "$notes" <<EOF
          Teler Desktop ${VERSION}, built from \`${GITHUB_SHA}\`.

          ${mac_note}
          ${win_note}
          - Linux: \`.AppImage\` or \`.deb\` (x64).

          Verify downloads with \`SHA256SUMS.txt\`. See \`desktop/README.md\`.
          EOF
          args=(
            "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$TITLE"
            --notes-file "$notes"
          )
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          # Published only once every installer is attached: update checks skip drafts.
          gh release create "${args[@]}" --draft installers/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
