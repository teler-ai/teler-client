name: Close outside pull requests

# Pull requests are accepted only from the teler-ai organization and this
# repository's collaborators; everyone else is asked to open an issue instead.
#
# A pull request from a branch of this repository is always kept: pushing that
# branch needed write access. One from a fork is kept only when GitHub reports
# its author as a member or collaborator. The event can leave out a private
# organization membership, and this workflow's token could not confirm one, so
# members open pull requests from branches here.
#
# `pull_request_target` runs in the context of this repository with a token
# that can close the pull request. It never checks out or runs the pull
# request's code: it only reads who opened it and calls the GitHub API.
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    name: Close if opened from outside the organization
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Close with a pointer to issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$NUMBER" --repo "$REPO" --comment "Thank you for your interest in the Teler clients!

          This repository accepts pull requests only from the teler-ai organization and its collaborators, so this one has been closed automatically.

          Please [open an issue](https://github.com/${REPO}/issues/new) instead: bug reports, questions and feature requests are welcome there. For security problems, follow [SECURITY.md](https://github.com/${REPO}/blob/main/SECURITY.md)."
