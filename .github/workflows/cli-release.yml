name: Publish teler CLI release

# Builds standalone `teler` executables (the Bun runtime included) for macOS,
# Linux and Windows and publishes them as a GitHub release, with
# SHA256SUMS.txt and the package tarball. `teler update` installs from these
# releases; nothing is published to a package registry.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel. Nightly is a manually published prerelease.'
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - stable
      version:
        description: 'Required for stable; must exactly match cli/package.json'
        required: false
        type: string

concurrency:
  group: cli-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Choose version and tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package_version="$(jq -r .version cli/package.json)"
          case "$CHANNEL" in
            stable)
              if [[ "$REQUESTED_VERSION" != "$package_version" ]]; then
                echo "::error::stable version must equal cli/package.json (${package_version})"
                exit 1
              fi
              version="$package_version"
              prerelease=false
              ;;
            nightly)
              version="${package_version}-nightly.${GITHUB_RUN_NUMBER}"
              prerelease=true
              ;;
            *)
              echo '::error::unsupported release channel'
              exit 1
              ;;
          esac
          tag="cli-v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release ${tag} already exists and will not be mutated"
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::tag ${tag} already exists and will not be reused"
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # Every platform finishes, so one run shows every problem; publishing still needs all.
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            targets: linux-x64 linux-arm64
            smoke: teler-linux-x64
          - platform: mac
            runner: macos-15
            targets: mac-arm64 mac-x64
            smoke: teler-mac-arm64
          - platform: win
            runner: windows-2025
            targets: win-x64
            smoke: teler-win-x64.exe
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The executable reports this version, which `teler update` compares.
      - name: Set the release version
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bun -e 'const f = "cli/package.json"; const p = await Bun.file(f).json(); p.version = process.env.VERSION; await Bun.write(f, JSON.stringify(p, null, 2) + "\n")'

      - name: Compile the teler executables
        shell: bash
        working-directory: cli
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          read -r -a targets <<< "$TARGETS"
          bun scripts/compile.ts "${targets[@]}"

      - name: Smoke-test the executable for this OS
        shell: bash
        working-directory: cli/release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          SMOKE: ${{ matrix.smoke }}
        run: |
          set -euo pipefail
          reported="$("./${SMOKE}" --version | tr -d '\r')"
          if [[ "$reported" != "teler ${VERSION}" ]]; then
            echo "::error::${SMOKE} reports '${reported}', expected 'teler ${VERSION}'"
            exit 1
          fi
          "./${SMOKE}" --help > /dev/null

      - name: Upload executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teler-cli-${{ matrix.platform }}
          path: cli/release/teler-*
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Set the release version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bun -e 'const f = "cli/package.json"; const p = await Bun.file(f).json(); p.version = process.env.VERSION; await Bun.write(f, JSON.stringify(p, null, 2) + "\n")'

      # For programs that use the CLI as a library with Bun (`@teler-ai/cli`).
      - name: Pack the package tarball
        working-directory: cli
        run: bun pm pack --destination ../package

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: teler-cli-package
          path: package/teler-ai-cli-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [plan, build, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: teler-cli-*
          path: release
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/cli-release-notes.md"
          cat > "$notes" <<EOF
          teler CLI ${VERSION}, built from \`${GITHUB_SHA}\`. Each executable includes the
          Bun runtime; no other installation is needed.

          - macOS: \`teler-mac-arm64\` (Apple silicon) or \`teler-mac-x64\` (Intel).
          - Linux: \`teler-linux-x64\` or \`teler-linux-arm64\`.
          - Windows: \`teler-win-x64.exe\`.

          Rename the file to \`teler\` (\`teler.exe\` on Windows), make it executable and put
          it on your \`PATH\`. Later, \`teler update\` installs new releases. Verify downloads
          with \`SHA256SUMS.txt\`. See \`cli/README.md\`.
          EOF
          args=(
            "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "teler CLI ${VERSION}"
            --notes-file "$notes"
            --latest=false
          )
          if [[ "$PRERELEASE" == true ]]; then
            args+=(--prerelease)
          fi
          # Published only once every file is attached: update checks skip drafts.
          gh release create "${args[@]}" --draft release/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
