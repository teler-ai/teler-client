name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  test-cli:
    name: Test CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test the teler CLI
        run: bun run --filter @teler-ai/cli test

      - name: Compile and run the release executable
        working-directory: cli
        run: |
          set -euo pipefail
          bun scripts/compile.ts linux-x64
          test "$(release/teler-linux-x64 --version)" = "teler $(jq -r .version package.json)"
          # The executable installs every file of the bundled skill, unchanged, for both agents;
          # SKILL.md differs only by the metadata setup adds.
          home="$(mktemp -d)"
          env -u CLAUDE_CONFIG_DIR HOME="$home" release/teler-linux-x64 agent setup --json > /dev/null
          for agent in .claude .agents; do
            installed="$home/$agent/skills/teler"
            diff <(cd skills/teler && find . -type f | sort) <(cd "$installed" && find . -type f | sort)
            diff -r skills/teler/references "$installed/references"
            diff skills/teler/SKILL.md \
              <(grep -vE '^(metadata:|  sha256: |  generator: )' "$installed/SKILL.md")
          done

  test-desktop:
    name: Test Desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Includes a contract test against the real CLI, the app's sync sidecar.
      - name: Test Teler Desktop
        run: bun run --filter desktop test

      - name: Build Teler Desktop bundles
        run: bun run --filter desktop build

  commit-identity:
    name: Commit identity
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test the check
        run: scripts/check-commit-identity.test.sh

      # The repository and its CI logs are public: every commit in the pull
      # request uses GitHub noreply addresses, and the check never prints one.
      - name: Check commit authors, committers and messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commit-identity.sh "$BASE_SHA" "$HEAD_SHA"
