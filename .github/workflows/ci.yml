name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  test-cli:
    name: Test CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test the teler CLI
        run: bun run --filter @teler-ai/cli test

      - name: Compile and run the release executable
        working-directory: cli
        run: |
          set -euo pipefail
          bun scripts/compile.ts linux-x64
          test "$(release/teler-linux-x64 --version)" = "teler $(jq -r .version package.json)"

  test-desktop:
    name: Test Desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Includes a contract test against the real CLI, the app's sync sidecar.
      - name: Test Teler Desktop
        run: bun run --filter desktop test

      - name: Build Teler Desktop bundles
        run: bun run --filter desktop build

  package-desktop-mac:
    name: Package Desktop for macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build Teler Desktop bundles
        run: bun run --filter desktop build

      - name: Compile the macOS sync sidecars
        working-directory: desktop
        run: bun scripts/sidecar.ts mac-arm64 mac-x64

      # Signed as a release without signing secrets, but without the installers.
      - name: Package the apps
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: >-
          node node_modules/electron-builder/cli.js --mac dir --arm64 --x64 --publish never
          -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false

      - name: Verify the apps and their signatures
        working-directory: desktop
        run: bun scripts/verify-package.ts

      # A notarized release signs the sidecar with the hardened runtime and the
      # app's entitlements; it must still run under them.
      - name: Run the packaged sidecar under the hardened runtime
        working-directory: desktop
        run: |
          set -euo pipefail
          sidecar="${RUNNER_TEMP}/teler"
          cp release/mac-arm64/Teler.app/Contents/Resources/sidecar/teler "$sidecar"
          codesign --force --sign - --options runtime --entitlements build/entitlements.mac.plist "$sidecar"
          bun scripts/smoke-sidecar.ts "$sidecar"
